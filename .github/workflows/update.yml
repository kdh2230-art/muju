name: update-snow-map

on:
  schedule:
    # 5분마다 실행 (한 시간에 12번, 같은 간격). 초단기예보(매시 30분 발표)와 초단기실황(정시 10분 뒤)은 매번 새로 받고,
    # 단기예보(3시간마다 발표)는 새 발표가 있을 때만 받고 나머지는 저장해 둔 값을 씀
    - cron: "*/5 * * * *"
  workflow_dispatch:        # 수동 실행 버튼

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d3.outputs.page_url || steps.d2.outputs.page_url || steps.d1.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # 저장해 둔 단기예보·노선 예보 불러오기 (없으면 처음부터 받아옴)
      - id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            cache/short.json
            cache/route.json
          key: short-none
          restore-keys: short-

      - name: 라이브러리 설치
        run: pip install requests folium

      - name: 예보 가져와서 지도 만들기
        run: python snow_map.py
        env:
          SERVICE_KEY: ${{ secrets.SERVICE_KEY }}

      # 단기예보·노선 초단기예보를 새로 받아왔을 때만 저장 (캐시가 불필요하게 쌓이지 않게)
      - uses: actions/cache/save@v4
        if: hashFiles('cache/dirty') != ''
        with:
          path: |
            cache/short.json
            cache/route.json
          key: short-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # 배포는 가끔 "올린 파일을 못 찾음" 오류로 한 번 실패하는 일이 있어서, 실패하면 30초 뒤 최대 2번 더 시도
      - id: d1
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: 30초 대기 (재시도 1)
        if: steps.d1.outcome == 'failure'
        run: sleep 30

      - id: d2
        if: steps.d1.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: 30초 대기 (재시도 2)
        if: steps.d1.outcome == 'failure' && steps.d2.outcome == 'failure'
        run: sleep 30

      - id: d3
        if: steps.d1.outcome == 'failure' && steps.d2.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: 3번 모두 실패하면 이 실행을 실패로 표시
        if: steps.d1.outcome == 'failure' && steps.d2.outcome == 'failure' && steps.d3.outcome == 'failure'
        run: exit 1
