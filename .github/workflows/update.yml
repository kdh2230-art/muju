name: update-snow-map

on:
  schedule:
    # 초단기예보(매시 30분 발표, 45분부터 조회): 매시 47, 52, 57분에 시도
    - cron: "47,52,57 * * * *"
    # 단기예보(KST 02,05,08,11,14,17,20,23시 발표): 발표 15분, 25분 뒤에 시도
    # GitHub 시각은 UTC라서 한국시간에서 9시간 뺀 값(17,20,23,02,05,08,11,14시)
    - cron: "15,25 17,20,23,2,5,8,11,14 * * *"
  workflow_dispatch:        # 수동 실행 버튼

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 라이브러리 설치
        run: pip install requests folium

      - name: 예보 가져와서 지도 만들기
        run: python snow_map.py
        env:
          SERVICE_KEY: ${{ secrets.SERVICE_KEY }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
