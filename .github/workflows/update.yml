name: update-snow-map

on:
  schedule:
    # 초단기예보(매시 30분 발표): 36분부터 5분 간격으로 확인 (아직 안 올라왔으면 직전 발표로 표시, 올라오면 바로 반영)
    # 초단기실황(관측, 정시 10분 뒤부터 조회): 12, 17분
    - cron: "12,17,36,41,46,51,56 * * * *"
    # 단기예보(KST 02,05,08,11,14,17,20,23시 발표): 발표 15분, 25분 뒤에 시도
    # GitHub 시각은 UTC라서 한국시간에서 9시간 뺀 값(17,20,23,02,05,08,11,14시)
    - cron: "15,25 17,20,23,2,5,8,11,14 * * *"
  workflow_dispatch:        # 수동 실행 버튼

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d3.outputs.page_url || steps.d2.outputs.page_url || steps.d1.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 라이브러리 설치
        run: pip install requests folium

      - name: 예보 가져와서 지도 만들기
        run: python snow_map.py
        env:
          SERVICE_KEY: ${{ secrets.SERVICE_KEY }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # 배포는 가끔 "올린 파일을 못 찾음" 오류로 한 번 실패하는 일이 있어서, 실패하면 30초 뒤 최대 2번 더 시도
      - id: d1
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: 30초 대기 (재시도 1)
        if: steps.d1.outcome == 'failure'
        run: sleep 30

      - id: d2
        if: steps.d1.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: 30초 대기 (재시도 2)
        if: steps.d1.outcome == 'failure' && steps.d2.outcome == 'failure'
        run: sleep 30

      - id: d3
        if: steps.d1.outcome == 'failure' && steps.d2.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: 3번 모두 실패하면 이 실행을 실패로 표시
        if: steps.d1.outcome == 'failure' && steps.d2.outcome == 'failure' && steps.d3.outcome == 'failure'
        run: exit 1
